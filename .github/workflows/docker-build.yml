name: Docker Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        variant: [standard, alpine]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
        flavor: |
          suffix=-${{ matrix.variant }},onlatest=true

    - name: Build Docker image for testing
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile${{ matrix.variant == 'alpine' && '.alpine' || '' }}
        load: true
        tags: chronicon-test:${{ matrix.variant }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        IMAGE=chronicon-test:${{ matrix.variant }}
        docker run --rm "$IMAGE" --help > /dev/null

        # Seed a tiny archive and run a real export, so missing templates or
        # static assets in the image fail here rather than for users
        mkdir -p smoke && chmod 777 smoke
        docker run --rm --entrypoint python \
          -v "$PWD/scripts:/scripts:ro" -v "$PWD/smoke:/archives" \
          "$IMAGE" /scripts/seed_smoke_archive.py /archives
        docker run --rm -v "$PWD/smoke:/archives" \
          "$IMAGE" export --output-dir /archives --formats html,md --search-backend static

        test -f smoke/html/index.html
        test -f smoke/html/assets/css/archive.css
        test -f smoke/html/assets/js/search.js
        grep -q "Python Programming" smoke/html/index.html
        grep -rq "Python Programming" smoke/md

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile${{ matrix.variant == 'alpine' && '.alpine' || '' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
